# Levanta la API y MySQL para desarrollo: docker compose up --build
# Requiere un archivo .env con JWT_SECRET (ver .env.example).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: api_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-devpassword}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: api_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      JWT_ISSUER: ${JWT_ISSUER:-api-slim-php}
      JWT_TTL: ${JWT_TTL:-3600}
      APP_DEBUG: ${APP_DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
